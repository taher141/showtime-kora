<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل بث IPTV</title>
    <!-- استدعاء مكتبة mpegts.js -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        video { width: 100%; max-width: 800px; background: #000; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <h2>مشغل البث المباشر</h2>
    <video id="videoElement" controls autoplay muted></video>

    <script>
        if (mpegts.getFeatureList().mseLivePlayback) {
            var player = mpegts.createPlayer({
                type: 'mpegts', // نوع البث
                url: 'http://m0h.link:2082/live/2c:99:75:ff:03:53/R7RR659466/139103.ts',
                isLive: true,   // تفعيل وضع البث المباشر
            });
            
            player.attachMediaElement(document.getElementById('videoElement'));
            player.load();
            
            // محاولة التشغيل التلقائي (قد يتطلب كتم الصوت أولاً بسبب سياسات المتصفح)
            player.play().catch(function(error) {
                console.log("التشغيل التلقائي منع، يرجى الضغط على زر التشغيل يدوياً.", error);
            });
        } else {
            document.body.innerHTML += '<p style="color:red;">متصفحك لا يدعم تشغيل هذا النوع من البث.</p>';
        }
    </script>
</body>
</html>
