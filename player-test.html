<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
    <style>
        body { background: #000; color: #fff; text-align: center; padding: 20px; font-family: Arial; }
        video { width: 100%; max-width: 800px; background: #111; border-radius: 8px; }
        .msg { margin-top: 15px; padding: 10px; background: #222; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>📺 بث مباشر</h2>
    <video id="v" controls autoplay muted playsinline></video>
    <div id="msg" class="msg">جاري المحاولة...</div>
    <button onclick="location.reload()" style="margin-top:15px; padding:10px 20px; background:#007bff; color:#fff; border:none; border-radius:5px;">🔄 إعادة المحاولة</button>

    <script>
        const url = 'http://m0h.link:2082/live/2c:99:75:ff:03:53/R7RR659466/139103.ts';
        // محاولة مباشرة بدون ترميز قد تنجح مع بعض البروكسيات
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + url; 
        
        const video = document.getElementById('v');
        const msg = document.getElementById('msg');

        if (mpegts.getFeatureList().mseLivePlayback) {
            const player = mpegts.createPlayer({ type: 'mpegts', url: proxyUrl, isLive: true });
            player.attachMediaElement(video);
            player.load();
            
            player.on(mpegts.Events.ERROR, () => {
                msg.innerText = '❌ الخادم يرفض البروكسي. الحل الوحيد: اطلب رابط https أو m3u8 من المزود.';
                msg.style.color = '#ff6b6b';
            });

            video.play().then(() => {
                msg.innerText = '✅ يعمل! (اضغط على الشاشة لتفعيل الصوت)';
                msg.style.color = '#51cf66';
            }).catch(() => {
                msg.innerText = '⚠️ اضغط على زر التشغيل (▶) في المشغل';
            });
        } else {
            msg.innerText = '❌ متصفحك لا يدعم هذا النوع من البث';
        }
    </script>
</body>
</html>
