
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShowTime Kora - Player Test</title>

<style>
body {
  margin: 0;
  background: #080810;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h2 { color: #a855f7; padding: 15px; }
.player {
  width: 95%;
  max-width: 950px;
  margin: 20px auto;
  background: #000;
}
video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
}
#status {
  color: #c084fc;
  padding: 12px;
}
</style>
</head>

<body>

<h2>SHOWTIME KORA</h2>

<div class="player">
  <video id="video" controls autoplay playsinline></video>
</div>

<div id="status">جاهز للتشغيل</div>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

<script>
const video = document.getElementById('video');
const status = document.getElementById('status');

if (mpegts.isSupported()) {
  status.textContent = 'المتصفح يدعم MPEG-TS';
} else {
  status.textContent = 'المتصفح لا يدعم MPEG-TS';
}
</script>

</body>
</html>
